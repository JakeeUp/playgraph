version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: playgraph
      POSTGRES_PASSWORD: playgraph
      POSTGRES_DB: playgraph
    ports:
      - "5432:5432"
    volumes:
      - playgraph_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  playgraph_pgdata:
