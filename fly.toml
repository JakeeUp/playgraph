# Fly.io deployment for the PlayGraph PRIVATE DEMO: synthetic data only.
#
# DEMO_MODE turns off real sign-in, linking, every Steam/PSN/Clerk/IGDB call and
# all writes, and keeps sessions and rate limits in the web process's memory.
# So there is no Redis and no worker here, and it must stay ONE machine:
# deploy with `fly deploy --ha=false`. See DEPLOY.md, section "Demo deploy".

app = "playgraph-demo"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

# The demo keeps its synthetic data in a SQLite file inside the machine. Each
# boot migrates and seeds it fresh, so there is no Postgres to pay for and a
# restart resets the demo. The seed refuses to run over existing users, so a
# resumed machine keeps its data.
[processes]
  app = "sh -c 'python -m app.migrations upgrade && (python -m scripts.seed_demo || true) && exec python -m app.serve'"

[env]
  ENVIRONMENT = "production"
  DEMO_MODE = "true"
  SESSION_MINUTES = "30"
  DATABASE_URL = "sqlite:////srv/demo.db"
  # FORWARDED_ALLOW_IPS is NOT set here. Set it with `fly secrets set` after
  # verifying the proxy peer address (DEPLOY.md). Missing it refuses startup.

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 60

# The app already exposes GET /health and refuses to start on an out-of-date
# schema, so a failing health check here means the container is genuinely unwell.
[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/health"
  [http_service.checks.headers]
    Host = "playgraph-demo.fly.dev"
    X-Forwarded-Proto = "https"

[[vm]]
  processes = ["app"]
  size = "shared-cpu-1x"
  memory = "512mb"
